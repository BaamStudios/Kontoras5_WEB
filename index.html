    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
      // Simple SPA redirect handler for custom domain
      // Retrieve the URL stored by 404.html and use it for client-side routing
      (function() {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          // Extract the path from the stored URL and update history
          var url = new URL(redirect);
          if (url.pathname !== '/' || url.search || url.hash) {
            window.history.replaceState(null, null, url.pathname + url.search + url.hash);
          }
        }
      })();
    </script>
